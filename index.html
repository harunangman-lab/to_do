<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <style>
    * { box-sizing: border-box; }
    :root { --background: #FFF9F9; --accent: #B86B7B; --card: #FFFFFF; --text: #4A3E3D; --muted: #856B70; --line: #F0DEE2; }
    body { margin: 0; min-height: 100vh; padding: 64px 20px; background: var(--background); color: var(--text); font-family: "Malgun Gothic", system-ui, -apple-system, sans-serif; }
    main { position: relative; max-width: 620px; margin: auto; padding: 40px 36px 30px; border: 1px solid var(--line); border-radius: 32px; background: var(--card); box-shadow: 0 16px 50px #B86B7B12; }
    main::before { content: ""; position: absolute; width: 78px; height: 22px; top: -11px; left: calc(50% - 39px); border: 1px solid #EACBD3; border-radius: 6px; background: #F7E1E7; transform: rotate(-5deg); }
    header { text-align: center; }
    .flower { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 22px; background: #FFF0F3; color: var(--accent); font-size: 38px; line-height: 1; transform: rotate(-8deg); }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: 2px; }
    h1 { margin: 0; font-size: 30px; letter-spacing: -1px; }
    .subtitle { margin: 12px 0 28px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    form { display: flex; gap: 10px; }
    input[type="text"] { min-width: 0; flex: 1; padding: 15px; border: 1px solid var(--line); border-radius: 16px; background: #FFFAFB; color: var(--text); font: inherit; font-size: 15px; }
    input[type="text"]::placeholder { color: var(--muted); }
    button { cursor: pointer; font: inherit; transition: background-color .18s, box-shadow .18s; }
    .add { padding: 0 22px; border: 0; border-radius: 16px; background: var(--accent); color: white; font-weight: 650; box-shadow: 0 4px 10px #B86B7B22; }
    .add:hover { background: #A35767; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .summary { width: fit-content; margin: 26px 0 14px; padding: 8px 12px; border-radius: 20px; background: #FFF1F4; color: var(--muted); font-size: 12px; line-height: 1.6; }
    ul { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 3px 10px #B86B7B08; }
    .task-label { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
    input[type="checkbox"] { flex-shrink: 0; width: 21px; height: 21px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .task-text { line-height: 1.6; overflow-wrap: anywhere; }
    .done { border-color: #E6C1CB; }
    .done .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); }
    .delete { flex-shrink: 0; min-height: 36px; padding: 7px 10px; border: 0; border-radius: 12px; background: #FFF0F3; color: #9B5263; font-size: 12px; }
    .delete:hover { background: #F8DDE5; }
    .empty { margin: 0; padding: 36px 12px; border: 2px dashed var(--line); border-radius: 20px; background: var(--card); color: var(--muted); text-align: center; font-size: 14px; line-height: 1.9; }
    .empty::before { content: "♡"; display: block; margin-bottom: 10px; color: var(--accent); font-size: 32px; line-height: 1; }
    .hint { margin: 26px 0 0; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.7; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    [hidden] { display: none; }
    @media (max-width: 480px) { body { padding: 24px 14px; } main { padding: 26px 20px; } h1 { font-size: 27px; } .add { padding: 0 17px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="flower" aria-hidden="true">✿</span>
      <p class="eyebrow">MY DAILY CHECKLIST</p>
      <h1>오늘의 할 일</h1>
      <p class="subtitle">작은 일부터 하나씩, 오늘을 가볍게 정리해 보세요.</p>
    </header>
    <form id="task-form">
      <label class="sr-only" for="task-input">새로운 할 일</label>
      <input id="task-input" type="text" placeholder="어떤 일을 해야 하나요?" maxlength="500" autocomplete="off" required>
      <button class="add" type="submit">추가</button>
    </form>
    <p class="summary" id="summary" aria-live="polite"></p>
    <ul id="task-list" aria-label="할 일 목록"></ul>
    <p class="empty" id="empty">아직 등록된 할 일이 없어요.<br>첫 번째 할 일을 추가해 보세요.</p>
    <p class="hint" id="storage-hint">할 일은 이 브라우저에 자동으로 저장됩니다.</p>
  </main>
  <script>
    const storageKey = 'daily-checklist-v1';
    const form = document.querySelector('#task-form');
    const input = document.querySelector('#task-input');
    const list = document.querySelector('#task-list');
    const summary = document.querySelector('#summary');
    const empty = document.querySelector('#empty');
    const storageHint = document.querySelector('#storage-hint');
    let tasks = [];

    function storageUnavailable() {
      storageHint.textContent = '브라우저 저장을 사용할 수 없어 현재 화면에서만 유지됩니다.';
    }

    try {
      const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
      if (Array.isArray(stored)) {
        tasks = stored.filter(task => task && typeof task.text === 'string' && typeof task.done === 'boolean');
      }
    } catch { storageUnavailable(); }

    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(tasks)); }
      catch { storageUnavailable(); }
    }

    function updateSummary() {
      const completed = tasks.filter(task => task.done).length;
      summary.textContent = `전체 ${tasks.length}개 · 완료 ${completed}개 · 남은 일 ${tasks.length - completed}개`;
      empty.hidden = tasks.length > 0;
    }

    function render() {
      list.replaceChildren();
      tasks.forEach(task => {
        const item = document.createElement('li');
        item.classList.toggle('done', task.done);
        const label = document.createElement('label');
        label.className = 'task-label';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          item.classList.toggle('done', task.done);
          save();
          updateSummary();
        });
        label.append(checkbox, text);
        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'delete';
        deleteButton.textContent = '삭제';
        deleteButton.setAttribute('aria-label', `${task.text} 삭제`);
        deleteButton.addEventListener('click', () => {
          const index = tasks.indexOf(task);
          tasks.splice(index, 1);
          save();
          render();
          const nextButton = list.children[Math.min(index, tasks.length - 1)]?.querySelector('.delete');
          (nextButton || input).focus();
        });
        item.append(label, deleteButton);
        list.append(item);
      });
      updateSummary();
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.value = ''; input.focus(); return; }
      tasks.push({ text, done: false });
      save();
      render();
      input.value = '';
      input.focus();
    });
    render();
  </script>
</body>
</html>
